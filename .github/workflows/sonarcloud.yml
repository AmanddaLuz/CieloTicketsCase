name: SonarCloud

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Report missing SonarCloud token
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::Configure the SONAR_TOKEN repository secret to enable analysis."

      - name: Generate analysis reports
        if: env.SONAR_TOKEN != ''
        run: >
          ./gradlew
          testDebugUnitTest
          lintDebug
          detekt
          koverXmlReportDebug
          assembleDebug
          --stacktrace

      - name: Analyze with SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
