name: SonarCloud

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate SonarCloud token
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::Configure the SONAR_TOKEN repository secret to enable analysis."
            exit 1
          fi

      - name: Unit tests for SonarCloud
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      - name: Android Lint report for SonarCloud
        run: ./gradlew lintDebug --console=plain --stacktrace

      - name: Print Android Lint findings
        if: failure()
        run: |
          if [[ -f app/build/reports/lint-results-debug.txt ]]; then
            cat app/build/reports/lint-results-debug.txt
          else
            echo "::warning::Android Lint text report was not generated."
          fi

      - name: Detekt report for SonarCloud
        run: ./gradlew detekt --console=plain --stacktrace

      - name: Kover coverage report for SonarCloud
        run: ./gradlew koverXmlReportDebug --console=plain --stacktrace

      - name: Verify analysis inputs
        run: |
          set -euo pipefail
          for report in \
            app/build/reports/kover/reportDebug.xml \
            app/build/reports/lint-results-debug.xml \
            app/build/reports/detekt/detekt.xml
          do
            if [[ ! -s "$report" ]]; then
              echo "::error file=$report::Required SonarCloud report is missing or empty."
              exit 1
            fi
            echo "Found $report ($(wc -c < "$report") bytes)"
          done

      - name: Assemble debug classes for SonarCloud
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload SonarCloud input reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-input-reports
          if-no-files-found: warn
          path: |
            app/build/reports/kover/reportDebug.xml
            app/build/reports/lint-results-debug.*
            app/build/reports/detekt/
            app/build/test-results/testDebugUnitTest/
